# RepoLens local infrastructure.
# For now only PostgreSQL is brought up; backend and Ollama services will be
# added later (see SDD §16).
services:
  postgres:
    image: postgres:16
    container_name: repolens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
